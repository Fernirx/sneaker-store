spring:
  application:
    name: Sneaker Api

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    clean-disabled: true

  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            scope: email,profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-name: Google
          facebook:
            scope: email,public_profile
            redirect-uri: "{baseUrl}/login/oauth2/code/facebook"
            client-name: Facebook
        provider:
          facebook:
            user-info-uri: https://graph.facebook.com/me?fields=id,first_name,last_name,email

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  mvc:
    locale: vi
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
  forward-headers-strategy: framework

application:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  cors:
    allowed-methods: [ GET, POST, PUT, DELETE, PATCH, OPTIONS ]
    allowed-headers: [ "*" ]
    allow-credentials: true
    max-age: 1h

  otp:
    ttl: ${OTP_TTL:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown: ${OTP_RESEND_COOLDOWN:60}

  security:
    jwt:
      issuer: sneaker-api
      access:
        expiration: ${JWT_ACCESS_EXPIRATION:PT10M}
      refresh:
        expiration: ${JWT_REFRESH_EXPIRATION:P7D}
      reset-password:
        expiration: ${JWT_RESET_PASSWORD_EXPIRATION:PT15M}

vnpay:
  payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}

order:
  expire-minutes: ${ORDER_EXPIRE_MINUTES:15}
  max-payment-attempts: ${ORDER_MAX_PAYMENT_ATTEMPTS:4}
  shipping-fee: ${ORDER_SHIPPING_FEE:30000}

customer:
  points-per-amount: ${CUSTOMER_POINTS_PER_AMOUNT:10000}
  silver-threshold: ${CUSTOMER_SILVER_THRESHOLD:5000000}
  gold-threshold: ${CUSTOMER_GOLD_THRESHOLD:15000000}
  platinum-threshold: ${CUSTOMER_PLATINUM_THRESHOLD:30000000}

ghn:
  api-url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
  fee-url: ${GHN_FEE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/fee}
  token: ${GHN_TOKEN:568912b0-e502-11ef-b2e4-6ec7c647cc27}
  shop-id: ${GHN_SHOP_ID:200925}
  from-ward-code: ${GHN_FROM_WARD_CODE:1003646}
  from-ward-name: ${GHN_FROM_WARD_NAME:Hiệp Phước}
  from-street: ${GHN_FROM_STREET:183/7 ấp 37}

